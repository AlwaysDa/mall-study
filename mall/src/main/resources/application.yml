server:
  port: 8080          # 服务端口

spring:
  application:
    name: mall        # 应用名
  datasource:
    url: "jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
    # 账号密码从环境变量读取，避免真实凭据进入代码仓库
    # 本地运行前需设置 DB_PASSWORD（IDEA: Run → Edit Configurations → Environment variables）
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # 本地默认连接 Memurai / Redis；密码和库号都可用环境变量覆盖
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      # Redis 不可用时不要一直挂起请求
      timeout: 3s

# JWT 登录鉴权配置
mall:
  jwt:
    # 签名密钥：生产环境务必通过环境变量 JWT_SECRET 注入，不要用下面这个占位值
    # HS256 要求密钥长度 >= 32 字节（字符），太短启动即报 WeakKeyException
    secret: ${JWT_SECRET:mall-study-dev-secret-key-change-me-in-prod}
    # 令牌有效期（秒），默认 7 天
    expire-seconds: 604800

